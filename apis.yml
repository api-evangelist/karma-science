name: Karma Science
description: 'Karma (Karma Science, karmanow.com) is a consumer shopping-assistant
  platform delivered as a browser extension and mobile app that helps people shop
  smarter. Founded in 2015, it serves roughly 6.5 million users with automatic coupon
  finding at checkout, price-drop and back-in-stock tracking, cross-retailer wishlists,
  and cash-back rewards across major merchants including Amazon, Apple, Nike, Target,
  and Nordstrom. The company also offers an Embedded Loyalty and partnerships program
  for retailers. Karma is a Kleiner Perkins-backed consumer company; as surfaced through
  the API Evangelist enrichment pipeline it publishes consumer product surfaces (apps,
  help center, blog) but no public developer API, SDK, or developer portal.'
